<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categoria | VM Click</title>
<meta name="description" content="Produtos por categoria na VM Click: elétrica, iluminação, hidráulica, utilidades e pintura.">
<link rel="icon" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<script>document.documentElement.classList.add('js-anim');</script>
</head>
<body>

<a class="skip-link" href="#main">Pular para o conteúdo</a>
<header class="site-header" id="site-header"></header>

<main id="main">

  <section class="page-hero">
    <div class="container">
      <nav class="woocommerce-breadcrumb" id="migalha" aria-label="Você está aqui"></nav>
      <h1 id="cat-titulo">Categoria</h1>
      <p id="cat-desc"></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="shop-layout">

        <aside class="filters" id="filtros" aria-label="Filtros de produto"></aside>

        <div>
          <div class="shop-toolbar">
            <div class="row" style="flex:1;min-width:240px">
              <div class="searchbox" style="max-width:340px">
                <label class="sr-only" for="busca-vitrine">Buscar nesta categoria</label>
                <input id="busca-vitrine" type="search" autocomplete="off" placeholder="Buscar nesta categoria…">
              </div>
              <button class="btn btn--outline btn--sm filters-toggle" id="abrir-filtros" type="button">Filtros</button>
            </div>
            <div class="row">
              <span class="shop-toolbar__count" id="contador"></span>
              <label class="sr-only" for="ordenar">Ordenar por</label>
              <select class="select" id="ordenar">
                <option value="relevancia">Mais relevantes</option>
                <option value="menor">Menor preço</option>
                <option value="maior">Maior preço</option>
                <option value="nota">Melhor avaliados</option>
                <option value="nome">Nome (A–Z)</option>
              </select>
            </div>
          </div>

          <div class="chips" id="chips" style="margin-bottom:20px"></div>

          <ul class="products" id="grid"></ul>
          <div class="pagination" id="paginacao"></div>
        </div>

      </div>
    </div>
  </section>

  <section class="section section--tight section--subtle">
    <div class="container">
      <div class="sec-head sec-head--split" style="margin-bottom:24px">
        <div>
          <span class="eyebrow">Continue navegando</span>
          <h2>Outras categorias</h2>
        </div>
      </div>
      <div class="cat-grid" id="outras"></div>
    </div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="data/produtos.js"></script>
<script src="assets/js/sprite.js"></script>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/catalog.js"></script>
<script>
document.addEventListener('vm:ready', function () {
  var slug = VM.param('cat');
  var cat = VM.categoria(slug);

  if (!cat) { window.location.replace('produtos.html'); return; }

  document.title = cat.nome + ' | VM Click';
  document.getElementById('cat-titulo').textContent = cat.nome;
  document.getElementById('cat-desc').textContent = cat.desc;
  document.getElementById('migalha').innerHTML =
    '<a href="index.html">Início</a><span class="sep">/</span>' +
    '<a href="produtos.html">Produtos</a><span class="sep">/</span>' +
    '<span aria-current="page">' + cat.nome + '</span>';

  VM.initVitrine({ cat: slug });

  /* outras categorias */
  document.getElementById('outras').innerHTML = VM.categorias()
    .filter(function (c) { return c.slug !== slug; })
    .map(function (c) {
      var n = VM.produtos().filter(function (p) { return p.cat === c.slug; }).length;
      return '<a class="cat-card" href="categoria.html?cat=' + c.slug + '">' +
        VM.ico(c.icone, 'cat-card__ico') +
        '<h3>' + c.nome + '</h3>' +
        '<span class="cat-card__n">' + n + ' itens nesta demonstração</span>' +
        '<span class="cat-card__link">Ver produtos' + VM.icon('seta') + '</span></a>';
    }).join('');
});
</script>
<script src="assets/js/animations.js"></script>
</body>
</html>
