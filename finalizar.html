<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizar compra | VM Click</title>
<meta name="description" content="Finalize sua compra na VM Click com Pix, boleto ou cartão.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/brand/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/brand/favicon-180.png">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css?v=20261013b">
<script>document.documentElement.classList.add('js-anim');</script>
</head>
<body class="woocommerce-checkout">

<a class="skip-link" href="#main">Pular para o conteúdo</a>
<header class="site-header" id="site-header"></header>

<main id="main">

  <section class="page-hero">
    <div class="container">
      <nav class="woocommerce-breadcrumb" aria-label="Você está aqui">
        <a href="index.html">Início</a><span class="sep">/</span>
        <a href="carrinho.html">Carrinho</a><span class="sep">/</span>
        <span aria-current="page">Finalizar</span>
      </nav>
      <h1>Finalizar compra</h1>
      <p>Três passos: seus dados, a entrega e o pagamento. O pagamento é processado pelo Asaas - dados de cartão não passam pelo site.</p>
    </div>
  </section>

  <section class="section">
    <div class="container" id="checkout"></div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="data/produtos.js"></script>
<script src="assets/js/sprite.js"></script>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cart.js?v=20261013b"></script>
<script src="assets/js/frete.js?v=20261013b"></script>
<script src="assets/js/cartao.js?v=20261013b"></script>
<script src="assets/js/catalog.js?v=20261013b"></script>
<script>
document.addEventListener('vm:ready', function () {
  var raiz = document.getElementById('checkout');
  var passo = 1;
  var pagamento = null;
  var parcelas = 1;
  var enviando = false;

  /* Entrega: o endereço vem antes das opções. A cotação roda uma vez por CEP,
     quando o endereço está completo; editar o endereço à mão desliga o
     preenchimento automático pelo CEP. */
  var freteCotadoPara = null;
  var editandoEndereco = false;
  var esperaEndereco = null;

  /* Igual a OPCAO_RETIRADA de api/_frete.js: retirar não depende de cotação. */
  var RETIRADA = {
    id: 'retirada', tipo: 'retirada', transportadora: 'VM Click',
    servico: 'Retirar na loja - Portão', preco: 0, prazo: null,
    detalhe: 'R. Amadeu do Amaral, 1602 · pronto em 2 horas',
  };

  /* Os painéis são redesenhados a cada passo; o que a pessoa digitou fica
     aqui, senão voltar um passo apagaria o formulário. Só em memória: CPF e
     endereço não ficam gravados no navegador. */
  var dados = {};

  /* Regras de pagamento vêm do servidor (formas ativas, desconto do Pix,
     parcelas). Enquanto não chegam, vale o padrão da vitrine. */
  var cfg = { formas: ['pix', 'boleto', 'cartao'], descontoPix: 5, maxParcelas: 6, parcelaMinima: 25, boletoDias: 3, ativo: true };

  var PASSOS = ['Identificação', 'Entrega', 'Pagamento'];

  function r2(n) { return Math.round(n * 100) / 100; }
  function digitos(v) { return String(v || '').replace(/\D/g, ''); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function val(id) { return esc(dados[id] || ''); }

  /* Mesma conta do servidor (api/pedido.js), com o mesmo arredondamento:
     o total mostrado é conferido lá antes de cobrar. */
  function valores() {
    var bruto = r2(VMCart.subtotal() + VMCart.frete());
    var desconto = pagamento === 'pix' ? r2(bruto * cfg.descontoPix / 100) : 0;
    return { bruto: bruto, desconto: desconto, total: r2(bruto - desconto) };
  }

  function maxParcelas() {
    return Math.max(1, Math.min(cfg.maxParcelas, Math.floor(valores().total / cfg.parcelaMinima)));
  }

  /* Passo já feito é botão: no celular é o caminho de volta, já que a barra
     fixa de baixo só tem o total e o "Continuar". */
  function barraPassos() {
    return '<div class="steps">' + PASSOS.map(function (t, i) {
      var n = i + 1;
      var cls = n === passo ? ' is-active' : (n < passo ? ' is-done' : '');
      var miolo = '<span class="step__n">' + (n < passo ? '✓' : n) + '</span><span class="step__t">' + t + '</span>';
      return (n < passo
        ? '<button type="button" class="step step--link' + cls + '" data-ir-passo="' + n + '" aria-label="Voltar para ' + t + '">' + miolo + '</button>'
        : '<div class="step' + cls + '"' + (n === passo ? ' aria-current="step"' : '') + '>' + miolo + '</div>') +
        (n < PASSOS.length ? '<span class="step__bar"></span>' : '');
    }).join('') + '</div>';
  }

  function resumo() {
    var linhas = VMCart.linhas();
    var frete = VMCart.frete();
    var escolhida = VMFrete.selecionada();
    var v = valores();
    var pixPreview = pagamento !== 'pix' && cfg.formas.indexOf('pix') !== -1;
    return '' +
    '<aside class="summary">' +
      '<h3>Resumo</h3>' +
      linhas.map(function (l) {
        return '<div class="summary__row"><span>' + l.qtd + '× ' + esc(l.p.nome) + '</span><b>' + VM.money(l.sub) + '</b></div>';
      }).join('') +
      '<hr class="divider">' +
      '<div class="summary__row"><span>Subtotal</span><b>' + VM.money(VMCart.subtotal()) + '</b></div>' +
      '<div class="summary__row"><span>Frete' +
        (escolhida ? '<br><small class="subtle">' + esc(escolhida.servico) + '</small>' : '') +
        '</span><b>' +
          (!escolhida ? 'A calcular'
            : (escolhida.tipo === 'combinar' ? 'A combinar' : (frete === 0 ? 'Grátis' : VM.money(frete)))) + '</b></div>' +
      (escolhida ? '' : '<p class="frete-nota">O frete é calculado pelo CEP no passo de entrega.</p>') +
      (v.desconto > 0
        ? '<div class="summary__row" style="color:var(--success)"><span>Desconto Pix (' + cfg.descontoPix + '%)</span><b>− ' + VM.money(v.desconto) + '</b></div>'
        : '') +
      '<div class="summary__total"><span>Total</span><span class="v">' + VM.money(v.total) + '</span></div>' +
      (pixPreview && cfg.descontoPix > 0
        ? '<p style="font-size:13px;color:var(--success);font-weight:600">' +
            VM.money(r2(v.bruto - r2(v.bruto * cfg.descontoPix / 100))) + ' com ' + cfg.descontoPix + '% de desconto no Pix</p>'
        : '') +
    '</aside>';
  }

  function painelIdentificacao() {
    return '<div class="panel stack-6">' +
      '<h3>Seus dados</h3>' +
      '<div class="field-grid field-grid--2">' +
        '<div class="field"><label for="nome">Nome completo <span class="req">*</span></label>' +
          '<input id="nome" autocomplete="name" placeholder="Nome e sobrenome" value="' + val('nome') + '"><span class="err">Informe nome e sobrenome.</span></div>' +
        '<div class="field"><label for="doc">CPF ou CNPJ <span class="req">*</span></label>' +
          '<input id="doc" inputmode="numeric" placeholder="000.000.000-00" value="' + val('doc') + '"><span class="err">Informe um CPF ou CNPJ válido.</span></div>' +
        '<div class="field"><label for="email">E-mail <span class="req">*</span></label>' +
          '<input id="email" type="email" autocomplete="email" placeholder="voce@email.com" value="' + val('email') + '"><span class="err">Informe um e-mail válido.</span></div>' +
        '<div class="field"><label for="tel">Telefone <span class="req">*</span></label>' +
          '<input id="tel" inputmode="tel" autocomplete="tel" placeholder="(41) 90000-0000" value="' + val('tel') + '"><span class="err">Informe DDD + número.</span></div>' +
      '</div>' +
      '<label class="filter-opt" style="padding:0"><input type="checkbox" id="pj"' + (dados.pj ? ' checked' : '') + '>Comprar como pessoa jurídica (emitir NF-e para CNPJ)</label>' +
    '</div>';
  }

  function linhaEndereco2() {
    var cidade = [dados.cidade, dados.uf].filter(Boolean).join(' – ');
    return [dados.bairro, cidade].filter(Boolean).join(' · ');
  }

  function painelEntrega() {
    var temEndereco = Boolean(dados.rua && dados.cidade) && !editandoEndereco;
    return '<div class="checkout-etapa">' +
      '<div class="panel stack-6">' +
        '<div class="panel__cab"><h3>Onde você quer receber?</h3>' +
          '<p class="muted">Digite o CEP: o endereço é preenchido sozinho.</p></div>' +
        '<div class="cep-linha">' +
          '<div class="field"><label for="cep">CEP <span class="req">*</span></label>' +
            '<input id="cep" inputmode="numeric" autocomplete="postal-code" maxlength="9" placeholder="80000-000" value="' + esc(dados.cep || VMFrete.cep() || '') + '">' +
            '<span class="err">Informe um CEP válido.</span></div>' +
          '<a class="cep-linha__ajuda" href="https://buscacepinter.correios.com.br/app/endereco/index.php" target="_blank" rel="noopener">Não sei meu CEP</a>' +
        '</div>' +
        '<div class="end-resumo" id="end-resumo"' + (temEndereco ? '' : ' hidden') + '>' +
          VM.icon('local') +
          '<span class="end-resumo__texto"><b id="end-linha1">' + val('rua') + '</b><span id="end-linha2">' + esc(linhaEndereco2()) + '</span></span>' +
          '<button type="button" class="btn btn--ghost btn--sm" id="editar-endereco">Editar</button>' +
        '</div>' +
        '<div class="field-grid field-grid--2" id="end-completo"' + (editandoEndereco ? '' : ' hidden') + '>' +
          '<div class="field"><label for="rua">Endereço <span class="req" data-req-end>*</span></label><input id="rua" autocomplete="address-line1" placeholder="Rua, avenida…" value="' + val('rua') + '"><span class="err">Informe o endereço.</span></div>' +
          '<div class="field"><label for="bairro">Bairro <span class="req" data-req-end>*</span></label><input id="bairro" placeholder="Portão" value="' + val('bairro') + '"><span class="err">Informe o bairro.</span></div>' +
          '<div class="field"><label for="cidade">Cidade <span class="req" data-req-end>*</span></label><input id="cidade" autocomplete="address-level2" placeholder="Curitiba" value="' + val('cidade') + '"><span class="err">Informe a cidade.</span></div>' +
          '<div class="field"><label for="uf">UF <span class="req" data-req-end>*</span></label><input id="uf" autocomplete="address-level1" maxlength="2" placeholder="PR" style="text-transform:uppercase" value="' + val('uf') + '"><span class="err">Informe a UF.</span></div>' +
        '</div>' +
        '<div class="field-grid field-grid--2">' +
          '<div class="field"><label for="numero">Número <span class="req" data-req-end>*</span></label><input id="numero" placeholder="Ex.: 1602" value="' + val('numero') + '"><span class="err">Informe o número.</span></div>' +
          '<div class="field"><label for="compl">Complemento</label><input id="compl" autocomplete="address-line2" placeholder="Apto, bloco, referência" value="' + val('compl') + '"></div>' +
        '</div>' +
      '</div>' +
      '<div class="panel stack-6">' +
        '<div class="panel__cab"><h3>Como você quer receber?</h3>' +
          '<p class="muted">Previsão a partir da postagem, no próximo dia útil.</p></div>' +
        '<div id="frete-opcoes"></div>' +
      '</div>' +
    '</div>';
  }

  function painelPagamento() {
    var v = valores();
    var opcoes = [
      { v: 'pix',    i: 'pix',    t: 'Pix', d: (cfg.descontoPix > 0 ? cfg.descontoPix + '% de desconto · ' : '') + 'aprovação imediata' },
      { v: 'cartao', i: 'cartao', t: 'Cartão de crédito', d: (maxParcelas() > 1 ? 'Até ' + maxParcelas() + '× sem juros · ' : '') + 'aprovação na hora' },
      { v: 'boleto', i: 'boleto', t: 'Boleto bancário', d: 'Vence em ' + cfg.boletoDias + ' dias · compensação em até 2 dias úteis' }
    ].filter(function (o) { return cfg.formas.indexOf(o.v) !== -1; });

    if (!cfg.ativo || !opcoes.length) {
      return '<div class="panel stack-6"><h3>Pagamento</h3>' +
        '<div class="frete-aviso"><b>O pagamento online ainda não está disponível.</b>' +
          '<p>Fale com a loja pelo WhatsApp para fechar este pedido.</p>' +
          '<a class="btn btn--wa btn--sm" target="_blank" rel="noopener" href="' + VM.EMPRESA.whatsapp + '">Falar com a loja</a></div>' +
      '</div>';
    }

    var seletorParcelas = '';
    if (pagamento === 'cartao' && maxParcelas() > 1) {
      var ops = '';
      for (var n = 1; n <= maxParcelas(); n++) {
        ops += '<option value="' + n + '"' + (n === parcelas ? ' selected' : '') + '>' +
          n + '× de ' + VM.money(v.total / n) + (n > 1 ? ' sem juros' : ' à vista') + '</option>';
      }
      seletorParcelas = '<div class="field"><label for="parcelas">Parcelas</label><select id="parcelas">' + ops + '</select></div>';
    }

    return '<div class="panel stack-6">' +
      '<h3>Pagamento</h3>' +
      '<div class="stack">' + opcoes.map(function (o) {
        return '<label class="pay-opt' + (o.v === pagamento ? ' is-sel' : '') + '">' +
          '<input type="radio" name="pgto" value="' + o.v + '"' + (o.v === pagamento ? ' checked' : '') + '>' +
          VM.icon(o.i) +
          '<span><span class="pay-opt__t">' + o.t + '</span><span class="pay-opt__d">' + o.d + '</span></span></label>';
      }).join('') + '</div>' +
      (pagamento === 'cartao' ? VMCartao.html() : '') +
      seletorParcelas +
      (pagamento === 'cartao'
        ? '<p class="frete-nota">Pagamento processado pelo Asaas em conexão segura. ' +
          'Os dados do cartão não ficam guardados no site.</p>'
        : '') +
      '<div id="erro-pagamento"></div>' +
    '</div>';
  }

  function textoBotao() {
    if (passo < 3) return 'Continuar';
    if (!cfg.ativo) return 'Pagamento indisponível';
    var total = VM.money(valores().total);
    if (pagamento === 'pix') return 'Gerar Pix de ' + total;
    if (pagamento === 'boleto') return 'Gerar boleto de ' + total;
    if (pagamento === 'cartao') return 'Pagar ' + total + ' com cartão';
    return 'Escolha a forma de pagamento';
  }

  function botoes() {
    var bloqueado = passo === 3 && (!cfg.ativo || !pagamento);
    return '<div class="checkout-acoes">' +
      (passo > 1
        ? '<button class="btn btn--ghost" type="button" id="voltar">← Voltar</button>'
        : '<a class="btn btn--ghost" href="carrinho.html">← Voltar ao carrinho</a>') +
      '<span class="checkout-acoes__total"><small>Total</small><b id="acoes-total">' + VM.money(valores().total) + '</b></span>' +
      '<button class="btn btn--primary btn--lg" type="button" id="avancar"' + (bloqueado ? ' disabled' : '') + '>' +
        textoBotao() + '</button>' +
    '</div>';
  }

  /* Guarda o que está na tela antes de redesenhar. */
  function coletar() {
    ['nome', 'doc', 'email', 'tel', 'cep', 'rua', 'numero', 'compl', 'bairro', 'cidade', 'uf'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) dados[id] = el.value.trim();
    });
    var pj = document.getElementById('pj');
    if (pj) dados.pj = pj.checked;
    if (dados.uf) dados.uf = dados.uf.toUpperCase();
  }

  function render() {
    if (!VMCart.linhas().length) {
      raiz.innerHTML =
        '<div class="empty-state">' + VM.icon('carrinho') +
        '<h3>Não há itens para finalizar</h3>' +
        '<p class="muted" style="margin-top:8px">Adicione produtos ao carrinho para fazer o pedido.</p>' +
        '<a class="btn btn--primary" style="margin-top:24px" href="produtos.html">Ver produtos</a></div>';
      return;
    }

    if (pagamento && cfg.formas.indexOf(pagamento) === -1) pagamento = null;
    if (!pagamento && cfg.formas.length) pagamento = cfg.formas[0];
    parcelas = Math.min(parcelas, maxParcelas());

    var painel = passo === 1 ? painelIdentificacao() : (passo === 2 ? painelEntrega() : painelPagamento());

    raiz.innerHTML = barraPassos() +
      '<div class="checkout-layout"><div>' + painel + botoes() + '</div>' + resumo() + '</div>';

    var avancar = document.getElementById('avancar');
    var voltar = document.getElementById('voltar');

    if (voltar) voltar.addEventListener('click', function () {
      coletar(); passo--; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    avancar.addEventListener('click', function () {
      if (!validar()) return;
      coletar();
      if (passo < 3) { passo++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      else concluir();
    });

    document.querySelectorAll('input[name="pgto"]').forEach(function (r) {
      r.addEventListener('change', function () { pagamento = this.value; render(); });
    });

    if (passo === 3 && pagamento === 'cartao') VMCartao.ligar(raiz);

    var selParcelas = document.getElementById('parcelas');
    if (selParcelas) selParcelas.addEventListener('change', function () {
      parcelas = parseInt(this.value, 10) || 1;
      avancar.textContent = textoBotao();
    });

    raiz.querySelectorAll('[data-ir-passo]').forEach(function (b) {
      b.addEventListener('click', function () {
        coletar(); passo = Number(b.getAttribute('data-ir-passo')); render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    var cep = document.getElementById('cep');
    if (cep) {
      /* CEP completo já busca o endereço; as opções de entrega aparecem
         quando o endereço fica completo (ver atualizarOpcoes). */
      cep.addEventListener('input', function () {
        this.value = VMFrete.formatarCep(this.value);
        freteCotadoPara = null;
        if (digitos(this.value).length === 8) { editandoEndereco = false; preencherEndereco(this.value); }
        else atualizarOpcoes();
      });

      ['rua', 'numero', 'bairro', 'cidade', 'uf'].forEach(function (id) {
        document.getElementById(id).addEventListener('input', function () {
          clearTimeout(esperaEndereco);
          esperaEndereco = setTimeout(atualizarOpcoes, 350);
        });
      });

      document.getElementById('editar-endereco').addEventListener('click', function () {
        editandoEndereco = true;
        mostrarEnderecoCompleto();
        document.getElementById('rua').focus();
      });

      if (digitos(cep.value).length === 8 && !document.getElementById('rua').value) preencherEndereco(cep.value);
      else atualizarOpcoes();
    }

    marcarEnderecoObrigatorio();
  }

  function enderecoPronto() {
    return ['rua', 'numero', 'bairro', 'cidade', 'uf'].every(function (id) { return !invalido(id); });
  }

  function mostrarEnderecoCompleto() {
    var resumoEnd = document.getElementById('end-resumo');
    var completo = document.getElementById('end-completo');
    if (resumoEnd) resumoEnd.hidden = true;
    if (completo) completo.hidden = false;
  }

  function mostrarResumoEndereco() {
    var v = function (id) { return document.getElementById(id).value.trim(); };
    dados.rua = v('rua'); dados.bairro = v('bairro'); dados.cidade = v('cidade'); dados.uf = v('uf').toUpperCase();
    document.getElementById('end-linha1').textContent = dados.rua;
    document.getElementById('end-linha2').textContent = linhaEndereco2();
    document.getElementById('end-resumo').hidden = false;
    document.getElementById('end-completo').hidden = true;
  }

  /* O endereço vem antes do frete: sem ele completo, a caixa de opções pede
     o que falta - e oferece a retirada, que dispensa endereço. */
  function atualizarOpcoes() {
    var alvo = document.getElementById('frete-opcoes');
    var campo = document.getElementById('cep');
    if (!alvo || !campo) return;
    var cep = digitos(campo.value);
    var atual = VMFrete.selecionada();

    if (cep.length !== 8) {
      freteCotadoPara = null;
      alvo.innerHTML = '<p class="frete-espera">Digite o CEP para ver as opções de entrega.</p>';
      return;
    }

    if (!enderecoPronto()) {
      freteCotadoPara = null;
      if (atual && atual.tipo === 'retirada') { mostrarSoRetirada(alvo); return; }
      alvo.innerHTML =
        '<div class="frete-espera"><p>Preencha o endereço completo, com o número, para ver as opções de entrega.</p>' +
        '<button type="button" class="btn btn--ghost btn--sm" id="so-retirar">' + VM.icon('loja') + 'Vou retirar na loja</button></div>';
      document.getElementById('so-retirar').addEventListener('click', function () {
        VMFrete.escolher(RETIRADA);
        mostrarSoRetirada(alvo);
        aoMudarFrete();
      });
      return;
    }

    if (freteCotadoPara === cep) return;
    freteCotadoPara = cep;
    calcularFrete();
  }

  function mostrarSoRetirada(alvo) {
    VMFrete.montarSeletor(alvo, { opcoes: [RETIRADA] }, { aoEscolher: aoMudarFrete });
  }

  /* O que vai pronto na mensagem de "entrega em até 24h" pelo WhatsApp. */
  function mensagemEntregaRapida() {
    coletar();
    var end = [dados.rua, dados.numero].filter(Boolean).join(', ') +
      (dados.compl ? ' - ' + dados.compl : '') + ', ' + linhaEndereco2();
    return 'Olá! Quero cotar a entrega em até 24 horas.\n' +
      'CEP: ' + VMFrete.formatarCep(dados.cep) + '\n' +
      'Endereço: ' + end + '\n' +
      'Itens: ' + VMCart.linhas().map(function (l) { return l.qtd + 'x ' + l.p.nome + ' (' + l.p.sku + ')'; }).join('; ') + '\n' +
      'Subtotal: ' + VM.money(VMCart.subtotal());
  }

  /* Retirada na loja dispensa endereço; o resto precisa dele para entregar. */
  function exigeEndereco() {
    var e = VMFrete.selecionada();
    return !(e && e.tipo === 'retirada');
  }

  function marcarEnderecoObrigatorio() {
    var exige = exigeEndereco();
    document.querySelectorAll('[data-req-end]').forEach(function (el) { el.hidden = !exige; });
  }

  /* Completa rua, bairro, cidade e UF pelo CEP (ViaCEP), sem sobrescrever o
     que a pessoa já digitou. Falhar aqui não atrapalha: os campos seguem
     editáveis. */
  function preencherEndereco(cep) {
    var d = digitos(cep);
    var alvo = document.getElementById('frete-opcoes');
    if (alvo) alvo.innerHTML = '<p class="frete-espera">Buscando o endereço…</p>';

    fetch('https://viacep.com.br/ws/' + d + '/json/').then(function (r) { return r.json(); }).then(function (j) {
      var campo = document.getElementById('cep');
      if (!campo || digitos(campo.value) !== d) return; /* o CEP mudou enquanto buscava */
      if (!j || j.erro) {
        VM.toast('CEP não encontrado. Confira ou preencha o endereço.', 'warn');
        mostrarEnderecoCompleto(); atualizarOpcoes(); return;
      }
      var mapa = { rua: j.logradouro, bairro: j.bairro, cidade: j.localidade, uf: j.uf };
      Object.keys(mapa).forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.value = mapa[id] || '';
      });
      /* CEP de cidade inteira não traz rua: abre os campos para digitar */
      if (j.logradouro && j.bairro) mostrarResumoEndereco(); else mostrarEnderecoCompleto();
      atualizarOpcoes();
      var numero = document.getElementById('numero');
      if (numero && !numero.value && j.logradouro) numero.focus();
    }).catch(function () { mostrarEnderecoCompleto(); atualizarOpcoes(); });
  }

  /* Cota o CEP digitado e redesenha as opções e o resumo. */
  function calcularFrete() {
    var campo = document.getElementById('cep');
    var alvo = document.getElementById('frete-opcoes');
    if (!campo || !alvo) return;

    VMFrete.carregando(alvo);

    VMFrete.cotar(campo.value).then(function (dadosFrete) {
      VMFrete.montarSeletor(alvo, dadosFrete, { aoEscolher: aoMudarFrete, mensagemEntregaRapida: mensagemEntregaRapida });
      aoMudarFrete();
    }).catch(function (e) {
      /* Cotação fora do ar não pode virar beco sem saída: sem uma alternativa
         selecionável o pedido trava aqui e a venda se perde. A loja confirma
         o valor depois, como já fazia antes de existir cotação automática.
         O servidor só aceita esta opção enquanto a cotação estiver fora. */
      var combinar = {
        id: 'combinar', tipo: 'combinar', transportadora: 'VM Click',
        servico: 'Combinar entrega com a loja', preco: 0, prazo: null,
        detalhe: 'A equipe confirma valor e prazo antes do envio',
      };

      alvo.innerHTML =
        '<div class="frete-aviso"><b>Não conseguimos calcular o frete agora.</b>' +
          '<p>Tente de novo, ou siga com a compra: a loja confirma valor e prazo antes de enviar.</p>' +
          '<button type="button" class="btn btn--secondary btn--sm" id="tentar-frete">Tentar de novo</button></div>' +
        '<div id="frete-opcoes-reserva"></div>';
      if (e && e.message) console.warn('[frete]', e.message);

      document.getElementById('tentar-frete').addEventListener('click', function () {
        freteCotadoPara = null; VMFrete.escolher(null); atualizarOpcoes();
      });
      VMFrete.montarSeletor(document.getElementById('frete-opcoes-reserva'),
        { opcoes: [combinar, RETIRADA] }, { aoEscolher: aoMudarFrete });
      aoMudarFrete();
    });
  }

  function aoMudarFrete() {
    atualizarResumo();
    marcarEnderecoObrigatorio();
  }

  /* Só o resumo é redesenhado: recriar o painel inteiro faria o campo de CEP
     perder o foco no meio da digitação. */
  function atualizarResumo() {
    var antigo = document.querySelector('.summary');
    if (!antigo) return;
    var novo = document.createElement('div');
    novo.innerHTML = resumo();
    antigo.replaceWith(novo.firstChild);
    var totalBarra = document.getElementById('acoes-total');
    if (totalBarra) totalBarra.textContent = VM.money(valores().total);
  }

  function invalido(id) {
    var el = document.getElementById(id);
    if (!el) return false;
    var v = el.value.trim();
    var d = digitos(v);
    if (!v) return true;
    if (id === 'nome') return v.split(/\s+/).length < 2;
    if (id === 'doc') return d.length !== 11 && d.length !== 14;
    if (id === 'email') return !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    if (id === 'tel') return d.length < 10 || d.length > 11;
    if (id === 'cep') return d.length !== 8;
    if (id === 'uf') return !/^[A-Za-z]{2}$/.test(v);
    return false;
  }

  function validar() {
    var obrigatorios = [];
    if (passo === 1) obrigatorios = ['nome', 'doc', 'email', 'tel'];
    if (passo === 2) obrigatorios = ['cep'].concat(exigeEndereco() ? ['rua', 'numero', 'bairro', 'cidade', 'uf'] : []);
    var ok = true;

    if (passo === 2 && exigeEndereco() && ['rua', 'bairro', 'cidade', 'uf'].some(invalido)) mostrarEnderecoCompleto();

    ['nome', 'doc', 'email', 'tel', 'cep', 'rua', 'numero', 'bairro', 'cidade', 'uf'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var ruim = obrigatorios.indexOf(id) !== -1 && invalido(id);
      el.closest('.field').classList.toggle('is-invalid', ruim);
      if (ruim && ok) { el.focus(); ok = false; }
    });

    if (!ok) { VM.toast('Confira os campos destacados.', 'warn'); return false; }

    if (passo === 2 && !VMFrete.selecionada()) {
      VM.toast('Escolha uma forma de entrega.', 'warn');
      return false;
    }

    if (passo === 3 && !pagamento) {
      VM.toast('Escolha a forma de pagamento.', 'warn');
      return false;
    }

    if (passo === 3 && pagamento === 'cartao') {
      document.querySelectorAll('.cc-campos .field').forEach(function (f) { f.classList.remove('is-invalid'); });
      var erroCartao = VMCartao.validar();
      if (erroCartao) {
        var campoCartao = document.getElementById(erroCartao.campo);
        campoCartao.closest('.field').classList.add('is-invalid');
        campoCartao.focus();
        VM.toast(erroCartao.msg, 'warn');
        return false;
      }
    }

    return true;
  }

  function mostrarErro(msg) {
    var alvo = document.getElementById('erro-pagamento');
    if (!alvo) { VM.toast(msg, 'warn'); return; }
    alvo.innerHTML = '<div class="frete-aviso" role="alert"><b>Não foi possível concluir.</b><p>' + esc(msg) + '</p></div>';
  }

  /* Cria o pedido no servidor, que recalcula tudo e gera a cobrança. */
  function concluir() {
    if (enviando) return;
    enviando = true;

    var botao = document.getElementById('avancar');
    botao.disabled = true;
    botao.textContent = pagamento === 'cartao' ? 'Processando pagamento…' : 'Gerando pagamento…';

    var frete = VMFrete.selecionada();
    var corpo = {
      cliente: { nome: dados.nome, doc: dados.doc, email: dados.email, tel: dados.tel, pj: dados.pj },
      entrega: {
        cep: dados.cep, rua: dados.rua, numero: dados.numero, compl: dados.compl,
        bairro: dados.bairro, cidade: dados.cidade, uf: dados.uf,
      },
      itens: VMCart.linhas().map(function (l) { return { sku: l.p.sku, qtd: l.qtd }; }),
      frete: frete && frete.id,
      forma: pagamento,
      parcelas: pagamento === 'cartao' ? parcelas : 1,
      totalVisto: valores().total,
    };
    /* Cartão vai direto do campo para a requisição: não passa por `dados`
       nem fica guardado no navegador. */
    if (pagamento === 'cartao') corpo.cartao = VMCartao.dados();

    fetch('/api/pedido', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo),
    }).then(function (r) {
      return r.text().then(function (texto) {
        var j = {};
        try { j = JSON.parse(texto); } catch (e) { j = {}; }
        if (!r.ok) {
          var msg = j.erro || 'Serviço de pagamento indisponível no momento.';
          if (j.total != null) msg += ' Novo total: ' + VM.money(j.total) + '.';
          throw new Error(msg);
        }
        return j;
      });
    }).then(function (pedido) {
      try { localStorage.setItem('vm_ultimo_pedido', JSON.stringify({ id: pedido.id, numero: pedido.numero })); }
      catch (e) { /* segue */ }

      VMFrete.limpar();
      VMCart.limpar();

      window.location.href = 'pedido.html?id=' + encodeURIComponent(pedido.id);
    }).catch(function (e) {
      enviando = false;
      botao.disabled = false;
      botao.textContent = textoBotao();
      if (pagamento === 'cartao') VMCartao.limparCvv();
      mostrarErro(e.message);
    });
  }

  render();

  /* Redesenhar o painel inteiro no meio da digitação apagaria o campo em foco,
     então fora do passo 3 só o resumo é atualizado. */
  function aplicarCfg() { if (passo === 3) render(); else atualizarResumo(); }

  fetch('/api/pedido').then(function (r) {
    if (!r.ok) throw new Error('sem api');
    return r.json();
  }).then(function (j) {
    if (j && j.formas) { cfg = j; aplicarCfg(); }
  }).catch(function () {
    /* Sem servidor de funções (dev:estatico) não há como cobrar. */
    cfg.ativo = false;
    aplicarCfg();
  });
});
</script>
<script src="assets/js/animations.js"></script>
</body>
